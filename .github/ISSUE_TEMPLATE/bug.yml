name: Error
description: Algo no funciona como debería.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        No pongas nombres, claves ni textos de Writing de estudiantes reales.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Describe el error en pocas frases.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entrar como estudiante
        2. Abrir Matemática → sección 2 → tema 1
        3. Responder "1/2"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: dropdown
    id: modulo
    attributes:
      label: Parte afectada
      multiple: true
      options:
        - dominio (reglas, verificador, guardia)
        - datos (Room, paquete)
        - tutor (Kiwi)
        - sincro (Firebase)
        - app (pantallas)
        - contenido
        - herramientas (scripts del PC)
        - no lo sé
    validations:
      required: true
  - type: dropdown
    id: dispositivo
    attributes:
      label: Dispositivo
      options:
        - MatePad (HarmonyOS)
        - Emulador de tablet
        - Emulador de celular
        - Celular real
        - Otro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la app
      placeholder: "0.1.0 (versionCode 1)"
  - type: checkboxes
    id: impacto
    attributes:
      label: Impacto
      options:
        - label: Se pierde progreso o no se sincroniza
        - label: Kiwi revela una respuesta o aparece en una prueba
        - label: Un estudiante ve datos de otro
        - label: Se marca mal una respuesta
  - type: textarea
    id: extra
    attributes:
      label: Capturas o registros
      description: Revisa que no muestren datos personales.
