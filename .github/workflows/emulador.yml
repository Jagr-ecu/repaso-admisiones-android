# Tests en emulador (#47): los de androidTest sobre Android real, en la versión mínima (API 29, como la MatePad
# con HarmonyOS 4.3) y en la de destino (API 36).
#   :datos  Room, cola de subida, migraciones (MigrationTestHelper) y el verificador con el motor ICU.
#   :app    política de red (HTTP solo hacia la red local) y datos fuera de las copias de seguridad.
# Tarda unos 10-15 minutos, así que no corre en todos los PR: en cada push a main, en un PR con la etiqueta
# "emulador", los lunes y a mano. No es un check requerido del ruleset.
# Sin secretos: el google-services.json es el de prueba (.github/ci/). Las acciones van fijadas por SHA.
name: Emulador

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]
  schedule:
    - cron: "17 6 * * 1" # lunes 06:17 UTC: detecta cambios en las imágenes del emulador
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulador-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-test:
    name: emulador (API ${{ matrix.api }})
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'emulador')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            imagen: default # AOSP sin servicios de Google, como la MatePad
          - api: 36
            imagen: google_apis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activar KVM (aceleración del emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar JDK 17 y 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: google-services.json de prueba
        run: cp .github/ci/google-services.prueba.json app/google-services.json

      - name: Compilar los APK de prueba antes de arrancar el emulador
        run: ./gradlew --no-daemon :datos:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Tests en el emulador
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.imagen }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew --no-daemon :datos:connectedDebugAndroidTest :app:connectedDebugAndroidTest

      - name: Guardar los informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-emulador-api-${{ matrix.api }}
          path: |
            datos/build/reports/androidTests/
            app/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
