# CodeQL (ADR-0020): análisis de seguridad del código. Las alertas salen en Security → Code scanning.
# Kotlin necesita compilar: se usa un google-services.json de prueba (.github/ci/), sin ningún secreto.
# Las acciones van fijadas por SHA, con su versión en el comentario.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # lunes 05:41 UTC: las consultas de CodeQL se actualizan aunque el código no cambie
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar:
    name: CodeQL (${{ matrix.lenguaje }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write # subir los resultados a Code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - lenguaje: java-kotlin
            modo: manual
          - lenguaje: javascript-typescript # pruebas-reglas/ y app/src/main/assets/web/formulas.js
            modo: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar JDK 17 y 21
        if: matrix.modo == 'manual'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # El 17 para el toolchain de los módulos (jvmToolchain(17)) y el 21 para ejecutar Gradle y AGP.
          java-version: |
            17
            21

      - name: Configurar Gradle
        if: matrix.modo == 'manual'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: google-services.json de prueba
        if: matrix.modo == 'manual'
        run: cp .github/ci/google-services.prueba.json app/google-services.json

      - name: Iniciar CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: ${{ matrix.modo }}
          queries: security-extended
          config: |
            paths-ignore:
              - "**/build/**"
              - "app/src/main/assets/web/katex.min.js"
              - "app/src/main/assets/web/marked.umd.js"
              - "app/src/main/assets/contenido/**"

      - name: Compilar (main y tests de la JVM)
        if: matrix.modo == 'manual'
        run: ./gradlew --no-daemon --no-build-cache assembleDebug testClasses

      - name: Analizar
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.lenguaje }}"
