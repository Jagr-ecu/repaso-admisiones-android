# Título del PR (#45): con squash, el título del PR es el mensaje del commit en main, y release-please lo usa
# para la versión y el CHANGELOG. Se revisa con el mismo commitlint y la misma configuración
# (commitlint.config.mjs) que el hook commit-msg, así que las reglas viven en un solo lugar.
# El nombre del job (titulo-del-pr) es un check requerido en el ruleset de main (docs/proteccion-main.md).
# Las acciones van fijadas por SHA, con su versión en el comentario.
name: Título del PR

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  titulo-del-pr:
    name: titulo-del-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar commitlint
        # Sin scripts: el "prepare" de husky solo sirve en el PC.
        run: npm ci --ignore-scripts

      - name: Revisar el título
        # El título va por una variable de entorno, nunca dentro del script, para que no se pueda inyectar código.
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          echo "Título: $TITULO"
          if ! printf '%s\n' "$TITULO" | npx --no-install commitlint; then
            echo "::error::El título del PR no sigue Conventional Commits. Ejemplo: fix(sincro): no subir la vista previa. Ver CONTRIBUTING.md."
            exit 1
          fi
