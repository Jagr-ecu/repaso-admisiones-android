# CI (#44): en cada PR y en main, lo mismo que se pide antes de un PR en CLAUDE.md.
# `./gradlew check` corre los tests de la JVM, Spotless/ktlint, detekt, lint, Konsist y la cobertura mínima de
# Kover. Luego se arma el APK de depuración. No usa ningún secreto: el google-services.json es el de prueba
# (.github/ci/), con el proyecto demo-preparate.
# El nombre del job (build-y-tests) es el check requerido en el ruleset de main (docs/proteccion-main.md).
# Las acciones van fijadas por SHA, con su versión en el comentario.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En un PR, un push nuevo cancela la ejecución vieja. En main se termina cada una.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-y-tests:
    name: build-y-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar JDK 17 y 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # El 17 para el toolchain de los módulos (jvmToolchain(17)) y el 21 para ejecutar Gradle y AGP.
          java-version: |
            17
            21

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: google-services.json de prueba
        run: cp .github/ci/google-services.prueba.json app/google-services.json

      - name: Tests, formato, análisis estático y cobertura
        run: ./gradlew --no-daemon check

      - name: APK de depuración
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Guardar los informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Guardar el APK de depuración
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
