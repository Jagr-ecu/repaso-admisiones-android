# SBOM (ADR-0020): la lista de dependencias que van dentro del APK de release, en formato CycloneDX.
# Cada push a main deja el artefacto "sbom". Cuando llegue release-please (fase 5), se adjuntará al Release
# junto al APK firmado. Las acciones van fijadas por SHA, con su versión en el comentario.
name: SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # En un PR solo si cambian las dependencias o este workflow.
    paths:
      - "gradle/libs.versions.toml"
      - "**/build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/sbom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM CycloneDX de :app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: google-services.json de prueba
        run: cp .github/ci/google-services.prueba.json app/google-services.json

      - name: Generar el SBOM
        run: ./gradlew --no-daemon :app:cyclonedxDirectBom

      - name: Comprobar que tiene las dependencias del APK
        run: |
          componentes=$(jq '.components | length' app/build/reports/sbom/sbom.cdx.json)
          echo "Componentes: $componentes"
          jq -e '[.components[].name] | index("firebase-firestore") and index("room-runtime")' \
            app/build/reports/sbom/sbom.cdx.json > /dev/null

      - name: Guardar el SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: app/build/reports/sbom/sbom.cdx.json
          retention-days: 90
