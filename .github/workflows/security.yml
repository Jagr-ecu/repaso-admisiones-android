# Seguridad (ADR-0020). Corre en cada PR hacia main, en cada push a main y una vez por semana.
# Las acciones van fijadas por SHA (con su versión en el comentario): una etiqueta se puede mover, un SHA no.
name: Seguridad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # lunes 06:17 UTC: revisa el historial aunque no haya cambios
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial: un secreto borrado en un commit posterior sigue publicado
          persist-credentials: false

      # El binario oficial, comprobado con su checksum. Sin gitleaks-action, que pide licencia en organizaciones.
      - name: Instalar Gitleaks
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum --check --strict
          tar -xzf "$archivo" gitleaks
          ./gitleaks version

      - name: Buscar secretos en todo el historial
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --report-format sarif --report-path gitleaks.sarif .

      - name: Guardar el informe
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks
          path: gitleaks.sarif
          retention-days: 7
