# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
    groups:
      androidx-compose:
        patterns: ["androidx.compose*", "androidx.activity*", "androidx.lifecycle*", "androidx.core*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "com.google.devtools.ksp*"]
      firebase:
        patterns: ["com.google.firebase*", "com.google.gms*"]
      room-work:
        patterns: ["androidx.room*", "androidx.work*"]
      tests:
        patterns: ["junit*", "androidx.test*"]

  - package-ecosystem: npm
    directory: "/pruebas-reglas"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
    groups:
      firebase-tests:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
    groups:
      commit-tools:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies"]
